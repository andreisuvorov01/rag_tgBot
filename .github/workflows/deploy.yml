name: Deploy (systemd)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Бэкап базы и .env перед деплоем
        run: |
          set -e
          cd /var/www/TgRag
          STAMP=$(date +%F-%H%M%S)
          BACKUP_DIR=/var/backups/rag_tgBot
          mkdir -p "$BACKUP_DIR"
          DATABASE_URL="$(grep -E '^DATABASE_URL=' .env | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'")"
          if [ -n "$DATABASE_URL" ]; then
            pg_dump --format=custom --compress=6 --no-owner \
              --file="$BACKUP_DIR/db-$STAMP.dump" "$DATABASE_URL"
            test -s "$BACKUP_DIR/db-$STAMP.dump"
          else
            echo "::warning::DATABASE_URL не найден в .env — бэкап БД пропущен"
          fi
          cp .env "$BACKUP_DIR/env-$STAMP.bak"
          find "$BACKUP_DIR" -maxdepth 1 -type f -mtime +14 -delete

      - name: Обновить код
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd /var/www/TgRag
          rm -f .git/refs/remotes/origin/main.lock .git/refs/remotes/origin/*.lock \
            .git/*.lock 2>/dev/null || true
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+refs/heads/main:refs/remotes/origin/main"
          git reset --hard origin/main
          git log -1 --oneline

      - name: Зависимости
        run: |
          set -e
          cd /var/www/TgRag
          venv/bin/python -m pip install -r requirements.lock

      - name: Перезапуск сервиса
        run: sudo -n systemctl restart rag-bot

      - name: Проверка, что процесс жив
        run: |
          set -e
          sleep 5
          systemctl is-active rag-bot

      - name: Dump logs on failure
        if: failure()
        run: |
          systemctl is-active rag-bot || true
          sudo -n journalctl -u rag-bot -n 150 --no-pager || true
