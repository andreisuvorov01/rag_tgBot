[pytest]
asyncio_mode = auto
testpaths = tests
# Фиксированный basetemp: pytest иначе создаёт симлинк <tmp>/pytest-current,
# а на Windows его удаление на этапе teardown падает с PermissionError —
# тесты проходят, но процесс завершается кодом 1 и CI считает сборку красной.
addopts = -p no:cacheprovider --basetemp=rag-tmp/pytest
